<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="760" height="400" rx="12" fill="#f8f9fa"/>
  <text x="30" y="36" font-size="15" font-weight="700" fill="#24292f">联合索引的最左匹配：idx_user_event_time (user_id, event_type, created_at)</text>

  <line x1="370" y1="58" x2="370" y2="380" stroke="#d0d7de"/>

  <!-- 左：索引有序结构 -->
  <text x="30" y="66" font-size="14" font-weight="600" fill="#24292f">索引内部：按键有序存储</text>

  <rect x="34" y="181" width="286" height="78" rx="6" fill="#fff8c5"/>

  <text x="52" y="90" font-size="13" font-weight="600" fill="#24292f">① user_id</text>
  <text x="126" y="90" font-size="13" font-weight="600" fill="#24292f">② event_type</text>
  <text x="236" y="90" font-size="13" font-weight="600" fill="#24292f">③ created_at</text>
  <line x1="34" y1="100" x2="320" y2="100" stroke="#d0d7de"/>

  <g font-size="13" fill="#24292f">
    <text x="52" y="122">1</text><text x="126" y="122">click</text><text x="236" y="122">2026-01-05</text>
    <text x="52" y="148">1</text><text x="126" y="148">purchase</text><text x="236" y="148">2026-01-12</text>
    <text x="52" y="174">2</text><text x="126" y="174">click</text><text x="236" y="174">2026-01-08</text>
    <text x="52" y="196">42</text><text x="126" y="196">click</text><text x="236" y="196">2026-02-01</text>
    <text x="52" y="222">42</text><text x="126" y="222">click</text><text x="236" y="222">2026-02-02</text>
    <text x="52" y="248">42</text><text x="126" y="248">purchase</text><text x="236" y="248">2026-02-03</text>
    <text x="52" y="274">43</text><text x="126" y="274">login</text><text x="236" y="274">2026-01-20</text>
  </g>

  <text x="34" y="306" font-size="13" fill="#57606a">浅黄区：user_id = 42 的连续段</text>
  <text x="34" y="330" font-size="13" fill="#57606a">段内再按 event_type → created_at 有序</text>
  <text x="34" y="354" font-size="13" font-weight="600" fill="#24292f">可直接定位的前缀：① ｜ ①② ｜ ①②③</text>

  <!-- 右：SQL 命中对照 -->
  <text x="390" y="66" font-size="14" font-weight="600" fill="#24292f">典型 SQL 命中对照</text>

  <g>
    <rect x="390" y="82" width="340" height="64" rx="8" fill="#ffffff" stroke="#d0d7de"/>
    <text x="404" y="108" font-size="13" fill="#24292f">WHERE user_id = 42</text>
    <text x="404" y="130" font-size="13" font-weight="700" fill="#1a7f37">✓ 命中：连续前缀第 1 列</text>

    <rect x="390" y="160" width="340" height="64" rx="8" fill="#ffffff" stroke="#d0d7de"/>
    <text x="404" y="186" font-size="13" fill="#24292f">WHERE user_id=42 AND event_type='click'</text>
    <text x="404" y="208" font-size="13" font-weight="700" fill="#1a7f37">✓ 命中：连续前缀第 1、2 列</text>

    <rect x="390" y="238" width="340" height="64" rx="8" fill="#ffffff" stroke="#d0d7de"/>
    <text x="404" y="264" font-size="13" fill="#24292f">WHERE event_type = 'purchase'</text>
    <text x="404" y="286" font-size="13" font-weight="700" fill="#cf222e">✗ 失效：跳过前导列，整树索引扫描</text>

    <rect x="390" y="316" width="340" height="64" rx="8" fill="#ffffff" stroke="#d0d7de"/>
    <text x="404" y="342" font-size="13" fill="#24292f">WHERE user_id=42 AND created_at&gt;=…</text>
    <text x="404" y="364" font-size="13" font-weight="700" fill="#1a7f37">✓ 命中：但只用上第 1 列 user_id</text>
  </g>
</svg>
